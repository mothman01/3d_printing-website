<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mom's Portal Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}" defer></script>
</head>
<body class="login-page">

    <button type="button" class="btn btn-light theme-toggle theme-toggle-floating" data-theme-toggle>Dark Mode</button>

    <div class="login-container reveal">
        <p class="kicker">Admin Access</p>
        <h2>Sign In</h2>
        <p>Log in to manage listings and storefront content.</p>
        
        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/login" class="login-form">
            <input type="password" name="password" required placeholder="Enter your password">
            <button type="submit" class="btn btn-primary btn-block">Unlock Portal</button>
        </form>
        
        <div class="login-back-wrap">
            <a href="/" class="back-link">Back to Store</a>
        </div>
    </div>

</body>
</html>
